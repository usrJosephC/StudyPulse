map $http_origin $cors_origin {
  default "";
  ~^https?://localhost(?::[0-9]+)?$ $http_origin;
  ~^https?://127\.0\.0\.1(?::[0-9]+)?$ $http_origin;
  ~^https?://\[::1\](?::[0-9]+)?$ $http_origin;
  ~^https?://10\.[0-9]+\.[0-9]+\.[0-9]+(?::[0-9]+)?$ $http_origin;
  ~^https?://192\.168\.[0-9]+\.[0-9]+(?::[0-9]+)?$ $http_origin;
  ~^https?://172\.(?:1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+(?::[0-9]+)?$ $http_origin;
}

server {
  listen 8000;
  server_name _;

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  location /auth/v1/ {
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Expose-Headers "Content-Range, Link, Range, X-Total-Count, X-Supabase-Api-Version" always;
    add_header Vary "Origin" always;
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Allow-Headers "accept, accept-profile, apikey, authorization, content-profile, content-type, prefer, range, x-client-info, x-supabase-api-version, x-supabase-client-platform, x-supabase-client-platform-version" always;
      add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Vary "Origin" always;
      return 204;
    }
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://auth:9999/;
  }

  location /rest/v1/ {
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Expose-Headers "Content-Range, Link, Range, X-Total-Count, X-Supabase-Api-Version" always;
    add_header Vary "Origin" always;
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Allow-Headers "accept, accept-profile, apikey, authorization, content-profile, content-type, prefer, range, x-client-info, x-supabase-api-version, x-supabase-client-platform, x-supabase-client-platform-version" always;
      add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Vary "Origin" always;
      return 204;
    }
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://rest:3000/;
  }
}
